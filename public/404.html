<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paradise Nursery</title>
    <script type="text/javascript">
      // Redirect single-page app requests to the app entry point.
      const path = window.location.pathname;
      const repoName = '/Plant-Nursery';
      const normalizedPath = path.startsWith(repoName) ? path.slice(repoName.length) : path;
      const redirect = `${repoName}/?redirect=${encodeURIComponent(normalizedPath)}`;
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
